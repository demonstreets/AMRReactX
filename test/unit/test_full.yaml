# Full configuration example for YAML parser tests
geometry:
  type: stl
  file: "test/tanks.stl"
  scale: 0.5

domain:
  xmin: -10.0
  xmax: 10.0
  ymin: -5.0
  ymax: 5.0
  zmin: 0.0
  zmax: 12.0

mesh:
  n_cell: [256, 128, 64]
  max_level: 3
  blocking_factor: 16
  max_grid_size: 64
  refine:
    near_wall: true
    near_leak: false

physics:
  model: dispersion
  chemistry:
    mechanism: drm19
    mechanism_file: ""
  species:
    tracked: [CH4, C3H8, H2]
  transport:
    model: Simple
  eos:
    type: ideal_gas

time:
  stop_time: 30.0
  max_step: 50000
  cfl: 0.5
  dt_init: 5.0e-7
  dt_max: 0.005

leaks:
  - name: leak_main
    position: [0.0, 0.3, 1.5]
    radius: 0.02
    direction: [0.0, 0.0, 1.0]
    species:
      CH4: 0.9
      C3H8: 0.1
    mass_flow_rate: 0.25
    temperature: 310.0
    velocity: 12.0

  - name: leak_secondary
    position: [2.0, 0.0, 2.0]
    radius: 0.015
    direction: [0.5, 0.0, 0.866]
    species:
      H2: 1.0
    mass_flow_rate: 0.05
    temperature: 295.0
    velocity: 8.0


boundaries:
  faces:
    xlo: inlet
    xhi: outlet
    ylo: wall
    yhi: symmetry
    zlo: slip_wall
    zhi: outlet

wind:
  model: power_law
  reference_height: 10.0
  reference_speed: 4.0
  roughness_length: 0.05
  direction: [1.0, 0.0, 0.0]

pool:
  enabled: true
  position: [0.0, -1.0, 0.0]
  area: 2.5
  species: "C8H18"
  temperature: 298.0

ignition:
  enabled: false
  type: spark
  position: [1.0, 0.0, 0.5]
  time: 5.0
  energy: 100.0
  radius: 0.05

turbulence:
  model: k_epsilon
  constants:
    C_mu: 0.09
    C_eps1: 1.44
    C_eps2: 1.92
    sigma_k: 1.0
    sigma_eps: 1.3
  wall_function: launder_spalding

output:
  plot_int: 50
  chk_int: 200
  diagnostics: true
  diagnostics_interval: 5
  format: hdf5


parmparse:
  amr.derive_plot_vars: [avg_pressure, mag_vort]
