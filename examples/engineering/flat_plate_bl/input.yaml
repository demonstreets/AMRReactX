# =============================================================================
# my-pele — Flat Plate Boundary Layer (simplified)
# =============================================================================
# 2D domain, Inflow at x_lo, SlipWall at y_lo/y_hi, Outflow at x_hi.
# Uniform grid 160×24 with square cells (dx=dy=0.0125m).
# Low-Mach incompressible mode (peleLM.incompressible=1).
# =============================================================================

#----------------------DOMAIN DEFINITION------------------------
geometry.is_periodic = 0 0
geometry.coord_sys   = 0
geometry.prob_lo     = 0.0 0.0
geometry.prob_hi     = 2.0 0.3

# >>>>>>>>>>>>>  BC FLAGS <<<<<<<<<<<<<<<<
# Interior, Inflow, Outflow, Symmetry,
# SlipWallAdiab, NoSlipWallAdiab, SlipWallIsotherm, NoSlipWallIsotherm
peleLM.lo_bc = Inflow Inflow
peleLM.hi_bc = Outflow SlipWallAdiab

peleLM.incompressible = 1
peleLM.rho = 1.17
peleLM.mu = 0.0003

#-------------------------AMR CONTROL----------------------------
amr.n_cell          = 160 24
amr.v               = 1
amr.max_level       = 0
amr.n_error_buf     = 1 1 2 2
amr.blocking_factor = 8
amr.max_grid_size   = 64
amr.grid_eff        = 0.7

#--------------------------- Problem -------------------------------
prob.T_mean = 293.0
prob.P_mean = 101325.0
prob.meanFlowMag = 10.0
prob.meanFlowDir = 1

#-------------------------PeleLM CONTROL----------------------------
peleLM.v = 1
peleLM.aux_vars = k epsilon

peleLM.k.advect = 1
peleLM.k.Schmidt = 1.0

peleLM.epsilon.advect = 1
peleLM.epsilon.Schmidt = 1.3

amr.plot_per = 0.5
amr.max_step = 200
amr.dt_shrink = 0.1
amr.stop_time = 5.0
amr.cfl = 0.7
amr.derive_plot_vars = avg_pressure mag_vort

peleLM.les_model = kepsilon
